name: sipsmandu-prod

services:
  app:
    image: ${APP_IMAGE:-sipsmandu-app:test}
    env_file: .env.production
    restart: unless-stopped
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-sipsmandu-web:test}
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage:ro
    depends_on:
      - app

  ssr:
    image: ${SSR_IMAGE:-sipsmandu-ssr:test}
    restart: unless-stopped

  db:
    image: mysql:8
    restart: unless-stopped
    command: --performance-schema=OFF --innodb-buffer-pool-size=128M --max-connections=30
    mem_limit: 512m
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"]
      interval: 5s
      retries: 20

volumes:
  storage:
  dbdata:
