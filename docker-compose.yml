services:
  app:
    build: .
    user: "1000:1000"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8
    command: --performance-schema=OFF --innodb-buffer-pool-size=128M --max-connections=30
    mem_limit: 512m
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    mem_limit: 64m
  node:
    image: node:22
    user: "1000:1000"
    working_dir: /app
    environment:
      HOME: /tmp
    volumes:
      - ./:/app\
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  dbdata:
